      <rect x="3" y="4" width="14" height="16" rx="2" />
      <path d="M 7 4 V 2 H 13 V 4" />
      <line x1="6" y1="9" x2="14" y2="9" />
      <line x1="6" y1="13" x2="14" y2="13" />
