    <g transform="translate(22, 17)" stroke="#1D4ED8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="5" width="16" height="14" rx="2" />
      <path d="M 6 5 V 2 H 14 V 5" />
      <line x1="2" y1="10" x2="18" y2="10" />
