    <!-- 3 Clean Focus Tags -->
    <g transform="translate(16, 68)" font-family="'Archivo', sans-serif">
      <rect x="0" y="0" width="308" height="24" rx="4" fill="#F8FAFC" stroke="#E2E8F0" />
      <circle cx="12" cy="12" r="3" fill="#1D4ED8" />
      <text x="22" y="16" font-size="11" font-weight="700" fill="#1E293B">Corporate Accounting &amp; Tax Compliance</text>

      <rect x="0" y="30" width="308" height="24" rx="4" fill="#F8FAFC" stroke="#E2E8F0" />
      <circle cx="12" cy="42" r="3" fill="#1D4ED8" />
      <text x="22" y="46" font-size="11" font-weight="700" fill="#1E293B">4x4 Toyota Hilux Fleet &amp; Site Logistics</text>

      <rect x="0" y="60" width="308" height="24" rx="4" fill="#F8FAFC" stroke="#E2E8F0" />
      <circle cx="12" cy="72" r="3" fill="#1D4ED8" />
