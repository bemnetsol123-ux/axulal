    <g transform="translate(17, 16)" stroke="#2563EB" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 9 2 L 16 5 V 10 C 16 14 9 18 9 18 C 9 18 2 14 2 10 V 5 Z" fill="rgba(37,99,235,0.12)" />
