      <rect x="0" y="0" width="308" height="24" rx="4" fill="#F8FAFC" stroke="#E2E8F0" />
      <circle cx="12" cy="12" r="3" fill="#4D2E7E" />
      <text x="22" y="16" font-size="11" font-weight="700" fill="#1E293B">Highway Route Geometric Alignment</text>

      <rect x="0" y="30" width="308" height="24" rx="4" fill="#F8FAFC" stroke="#E2E8F0" />
      <circle cx="12" cy="42" r="3" fill="#4D2E7E" />
      <text x="22" y="46" font-size="11" font-weight="700" fill="#1E293B">Structural Bridges &amp; Drainage Culverts</text>

      <rect x="0" y="60" width="308" height="24" rx="4" fill="#F8FAFC" stroke="#E2E8F0" />
      <circle cx="12" cy="72" r="3" fill="#4D2E7E" />
      <text x="22" y="76" font-size="11" font-weight="700" fill="#1E293B">Hydrology &amp; Geotechnical Soil CBR</text>
    </g>
  </g>


