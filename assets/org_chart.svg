      <text y="20" font-size="10.5" font-weight="600" fill="#CBD5E1" letter-spacing="0.3">FULL-TIME SUPERVISION &amp; IN-SITU TESTING ACROSS REGIONAL ROAD CORRIDORS</text>
    </g>

    <!-- 4 Specialized Role Pills -->
    <g transform="translate(650, 18)" font-family="'JetBrains Mono', monospace" font-size="10">
      <rect x="0" y="0" width="200" height="22" rx="4" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.1)" />
      <circle cx="10" cy="11" r="3" fill="#38BDF8" />
      <text x="20" y="15" font-weight="700" fill="#F8FAFC">Resident Engineers (PE)</text>

      <rect x="215" y="0" width="205" height="22" rx="4" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.1)" />
      <circle cx="225" cy="11" r="3" fill="#FBBF24" />
      <text x="235" y="15" font-weight="700" fill="#F8FAFC">Materials &amp; Soil Technicians</text>

      <rect x="0" y="26" width="200" height="22" rx="4" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.1)" />
      <circle cx="10" cy="37" r="3" fill="#A78BFA" />
      <text x="20" y="41" font-weight="700" fill="#F8FAFC">Total Station Survey Crews</text>

      <rect x="215" y="26" width="205" height="22" rx="4" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.1)" />
      <circle cx="225" cy="37" r="3" fill="#34D399" />
      <text x="235" y="41" font-weight="700" fill="#F8FAFC">Inspectors of Works &amp; HSE</text>
    </g>
