<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%" style="background-color: #FFFFFF; font-family: 'Archivo', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="carbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282320" />
      <stop offset="100%" stop-color="#141210" />
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#552B94" />
      <stop offset="100%" stop-color="#3C1A6E" />
    </linearGradient>

    <!-- Clean Shadows -->
    <filter id="cleanShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(15,23,42,0.06)" />
    </filter>

    <filter id="glowViolet" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="rgba(77,46,126,0.25)" />
    </filter>
  </defs>

  <!-- Architectural Background Grid -->
  <g stroke="#E2E8F0" stroke-width="0.75" opacity="0.6">
    <line x1="60" y1="0" x2="60" y2="660" stroke-dasharray="3 3" />
    <line x1="230" y1="0" x2="230" y2="660" stroke-dasharray="3 3" />
    <line x1="600" y1="0" x2="600" y2="660" stroke-dasharray="3 3" />
    <line x1="970" y1="0" x2="970" y2="660" stroke-dasharray="3 3" />
    <line x1="1140" y1="0" x2="1140" y2="660" stroke-dasharray="3 3" />
    <line x1="0" y1="75" x2="1200" y2="75" stroke-dasharray="3 3" />
    <line x1="0" y1="265" x2="1200" y2="265" stroke-dasharray="3 3" />
    <line x1="0" y1="490" x2="1200" y2="490" stroke-dasharray="3 3" />
  </g>

  <!-- ================= HEADER BANNER ================= -->
  <g transform="translate(60, 24)">
    <!-- Dual-Tone Monogram -->
    <g transform="translate(0, 4) scale(0.105)">
      <path d="M 384 60 L 417 117 L 263 384 L 455 384 L 491 446 L 225 446 A 35 35 0 0 1 190 396 Z" fill="#000000" />
      <path d="M 444 172 L 602 446 L 526 446 L 444 304 L 362 446 L 286 446 Z" fill="#4D2E7E" />
    </g>

    <g transform="translate(75, 12)">
      <text font-size="11" font-weight="800" fill="#D97706" letter-spacing="2" font-family="'JetBrains Mono', monospace">AXULAL CONSULTING ENGINEERS PLC</text>
      <text y="22" font-size="19" font-weight="900" fill="#0F172A" letter-spacing="-0.5">Corporate Governance &amp; Institutional Structure</text>
    </g>

    <g transform="translate(1080, 14)" text-anchor="end">
      <rect x="-195" y="-3" width="195" height="26" rx="5" fill="#F5F0FA" stroke="rgba(77,46,126,0.25)" stroke-width="1.2" />
      <circle cx="-182" cy="10" r="3.5" fill="#4D2E7E" />
      <text x="-8" y="14" font-size="10" font-weight="800" fill="#4D2E7E" font-family="'JetBrains Mono', monospace" letter-spacing="0.5">CATEGORY-1 CONSULTANT</text>
      <text x="0" y="34" font-size="9" font-weight="600" fill="#64748B" font-family="'JetBrains Mono', monospace">FDRE MoWUD / ERA ACCREDITED</text>
    </g>
  </g>

  <!-- ================= STRUCTURAL PIPELINE CONNECTORS ================= -->
  <!-- Arterial Hierarchy Bus Lines -->
  <g stroke="#4D2E7E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shareholders to General Manager -->
    <path d="M 600 132 L 600 162" />

    <!-- General Manager to Distribution Bar -->
    <path d="M 600 234 L 600 270" />

    <!-- Horizontal Distribution Bar across 3 Operational Departments -->
    <path d="M 230 270 L 970 270" />

    <!-- Drops to the 3 Department cards -->
    <path d="M 230 270 L 230 298" />
    <path d="M 600 270 L 600 298" />
    <path d="M 970 270 L 970 298" />
  </g>

  <!-- Lower Convergence Bus: 3 Departments converge down to Projects Base -->
  <g stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 230 458 L 230 488" />
    <path d="M 600 458 L 600 488" />
    <path d="M 970 458 L 970 488" />
    <path d="M 230 488 L 970 488" />
    <path d="M 600 488 L 600 518" />
  </g>

  <!-- Side Advisory Branch: GM to Internal Audit & QA (Dashed line) -->
  <path d="M 380 198 L 270 198" stroke="#64748B" stroke-width="2" stroke-dasharray="4 4" fill="none" />

  <!-- Connection Nodes -->
  <g fill="#4D2E7E">
    <circle cx="600" cy="162" r="4" />
    <circle cx="600" cy="270" r="5" fill="#D97706" />
    <circle cx="230" cy="270" r="4" />
    <circle cx="970" cy="270" r="4" />
    <circle cx="230" cy="298" r="4" />
    <circle cx="600" cy="298" r="4" />
    <circle cx="970" cy="298" r="4" />
    <circle cx="600" cy="518" r="4" fill="#24201D" />
  </g>


  <!-- ================= TIER 1: SHAREHOLDERS ================= -->
  <g transform="translate(425, 78)" filter="url(#cleanShadow)">
    <rect width="350" height="54" rx="8" fill="url(#carbonGrad)" stroke="#3D3632" stroke-width="1.5" />
    
    <!-- Pediment Temple Vector Icon -->
    <rect x="12" y="10" width="34" height="34" rx="6" fill="rgba(255,255,255,0.08)" />
    <g transform="translate(19, 16)" stroke="#F59E0B" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 2 7 L 10 2 L 18 7 Z" fill="rgba(245,158,11,0.2)" />
      <line x1="1" y1="7" x2="19" y2="7" />
      <line x1="4" y1="7" x2="4" y2="17" />
      <line x1="10" y1="7" x2="10" y2="17" />
      <line x1="16" y1="7" x2="16" y2="17" />
      <line x1="1" y1="17" x2="19" y2="17" />
    </g>

    <g transform="translate(56, 24)">
      <text font-size="14.5" font-weight="900" fill="#FFFFFF" letter-spacing="1">SHAREHOLDERS</text>
      <text y="16" font-size="10" font-weight="700" fill="#FBBF24" letter-spacing="0.5">OWNERSHIP &amp; STRATEGIC GOVERNANCE</text>
    </g>
  </g>


  <!-- ================= ADVISORY WING: INTERNAL AUDIT & QA ================= -->
  <g transform="translate(60, 172)" filter="url(#cleanShadow)">
