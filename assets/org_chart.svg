    <g transform="translate(58, 27)">
      <text font-size="14" font-weight="900" fill="#D97706" letter-spacing="0.4">CONTRACT ADMINISTRATION</text>
      <text y="16" font-size="10" font-weight="700" fill="#B45309">TENDERS, BOQ &amp; PROCUREMENT</text>
    </g>

    <!-- 3 Clean Focus Tags -->
    <g transform="translate(16, 68)" font-family="'Archivo', sans-serif">
      <rect x="0" y="0" width="308" height="24" rx="4" fill="#F8FAFC" stroke="#E2E8F0" />
      <circle cx="12" cy="12" r="3" fill="#D97706" />
      <text x="22" y="16" font-size="11" font-weight="700" fill="#1E293B">Standard Bidding Documents (SBD/PPA)</text>

      <rect x="0" y="30" width="308" height="24" rx="4" fill="#F8FAFC" stroke="#E2E8F0" />
      <circle cx="12" cy="42" r="3" fill="#D97706" />
      <text x="22" y="46" font-size="11" font-weight="700" fill="#1E293B">Itemized Take-Off &amp; Comprehensive BoQ</text>

      <rect x="0" y="60" width="308" height="24" rx="4" fill="#F8FAFC" stroke="#E2E8F0" />
      <circle cx="12" cy="72" r="3" fill="#D97706" />
      <text x="22" y="76" font-size="11" font-weight="700" fill="#1E293B">Tender Dossiers &amp; IPC Payment Audits</text>
    </g>
  </g>


  <!-- 3. ADMINISTRATION & FINANCE DEPARTMENT -->
  <g transform="translate(800, 298)" filter="url(#cleanShadow)">
    <rect width="340" height="160" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Top Accent Bar -->
    <rect width="340" height="54" rx="10" fill="#EFF6FF" />
    <rect x="0" y="44" width="340" height="10" fill="#EFF6FF" />
    <line x1="0" y1="54" x2="340" y2="54" stroke="#BFDBFE" stroke-width="1.2" />

