  <!-- Footnote -->
  <g transform="translate(60, 638)" font-size="8.5" font-weight="600" fill="#94A3B8" font-family="'JetBrains Mono', monospace">
    <text>AXULAL CONSULTING ENGINEERS PLC • ADDIS ABABA, ETHIOPIA • CATEGORY-1 HIGHWAY CONSULTANT</text>
    <text x="1080" text-anchor="end">QUALITY MANAGEMENT SYSTEM COMPLIANT • ERA &amp; FIDIC STANDARDS</text>
  </g>
