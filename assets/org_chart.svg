    <!-- Top Accent Bar -->
    <rect width="340" height="54" rx="10" fill="#FFFBEB" />
    <rect x="0" y="44" width="340" height="10" fill="#FFFBEB" />
    <line x1="0" y1="54" x2="340" y2="54" stroke="#FDE68A" stroke-width="1.2" />

